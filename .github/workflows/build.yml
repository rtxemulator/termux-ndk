name: Build Termux-native NDK r28c (AArch64)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NDK_VERSION: "28.2.13676358"
  NDK_PACKAGE: "android-ndk-r28c-linux.zip"
  NDK_DIR: "android-ndk-r28c"
  LLVM_BRANCH: "llvm-r530567"
  LLVM_VERSION: "clang-r530567e"
  HOST_TRIPLE: "aarch64-linux-android"
  ANDROID_API: "28"
  LLVM_SOURCE_REVISION: "3b5e7c83a6e226d5bd7ed2e9b67449b64812074c"
  NDK_SHA1: "a7b54a5de87fecd125a17d54f73c446199e72a64"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Maximize build space
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build python3 git ccache wget unzip file
          cmake --version
          ninja --version
          git --version
          wget --version | head -n 1

      - name: Download official Android NDK r28c
        run: |
          set -euxo pipefail
          wget --show-progress \
            "https://dl.google.com/android/repository/${NDK_PACKAGE}"
          echo "${NDK_SHA1}  ${NDK_PACKAGE}" | sha1sum -c -
          unzip -q "${NDK_PACKAGE}"
          test -d "${NDK_DIR}"
          test -f "${NDK_DIR}/source.properties"
          grep -q "Pkg.Revision = ${NDK_VERSION}" \
            "${NDK_DIR}/source.properties"

      - name: Verify official NDK r28c
        run: |
          set -euxo pipefail
          LLVM_DIR="${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64"

          test -f "${NDK_DIR}/source.properties"
          grep -q "Pkg.Revision = ${NDK_VERSION}" \
            "${NDK_DIR}/source.properties"

          test -x "${LLVM_DIR}/bin/clang"
          test -x "${LLVM_DIR}/bin/clang++"
          test -x "${LLVM_DIR}/bin/ld.lld"

          cat "${NDK_DIR}/source.properties"
          "${LLVM_DIR}/bin/clang" --version

      - name: Checkout exact r28c Android LLVM sources and patch set
        run: |
          set -euxo pipefail

          rm -rf llvm-project llvm_android toolchain-utils

          # r28c is clang-r530567e. The Android llvm-r530567 branch
          # is the Android-side source/patch mapping for that release.
          git clone --filter=blob:none --no-checkout \
            https://android.googlesource.com/toolchain/llvm-project.git \
            llvm-project

          cd llvm-project
          git fetch --depth=1 origin "${LLVM_SOURCE_REVISION}"
          git checkout --detach "${LLVM_SOURCE_REVISION}"
          cd ..

          git clone --depth=1 -b "${LLVM_BRANCH}" \
            https://android.googlesource.com/toolchain/llvm_android.git \
            llvm_android

          git clone --depth=1 -b "${LLVM_BRANCH}" \
            https://android.googlesource.com/platform/external/toolchain-utils.git \
            toolchain-utils

          test "$(git -C llvm-project rev-parse HEAD)" = "${LLVM_SOURCE_REVISION}"
          test -f llvm_android/patches/PATCHES.json
          test -f toolchain-utils/llvm_tools/patch_manager.py

          # IMPORTANT: this r530567 patch_manager.py does NOT accept
          # files-directory option. Passing that option was the exact failure
          # in the previous run.
          PYTHONPATH="${GITHUB_WORKSPACE}/toolchain-utils" \
            python3 toolchain-utils/llvm_tools/patch_manager.py \
              --svn_version 530567 \
              --patch_metadata_file \
                "${GITHUB_WORKSPACE}/llvm_android/patches/PATCHES.json" \
              --src_path \
                "${GITHUB_WORKSPACE}/llvm-project" \
              --failure_mode fail

          # The patch manager must leave the r28c source tree at the
          # Android r530567 generation. Do not silently move to another
          # LLVM release.
          grep -Fq "3b5e7c83a6e226d5bd7ed2e9b67449b64812074c" \
            llvm_android/clang-r530567/clang_source_info.md

          echo "LLVM base revision:"
          git -C llvm-project rev-parse HEAD
          echo "Android LLVM patch branch:"
          git -C llvm_android rev-parse HEAD
          echo "Patched files:"
          git -C llvm-project status --short | head -100

      - name: Build native x86_64 LLVM host tools
        run: |
          set -euxo pipefail

          rm -rf native-tools native-build
          mkdir -p native-tools

          # These binaries execute on the GitHub runner during the
          # AArch64 cross-build. They MUST remain x86_64 Linux binaries.
          cmake \
            -S llvm-project/llvm \
            -B native-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang" \
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64;ARM" \
            -DLLVM_BUILD_TESTS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBEDIT=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_CURL=OFF \
            -DLLVM_ENABLE_FFI=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF

          cmake --build native-build \
            --target \
              llvm-tblgen \
              llvm-min-tblgen \
              clang-tblgen \
              llvm-config \
              clang-ast-dump \
            --parallel "$(nproc)"

          for tool in \
            llvm-tblgen \
            llvm-min-tblgen \
            clang-tblgen \
            llvm-config \
            clang-ast-dump; do
            test -x "native-build/bin/${tool}"
            cp -a "native-build/bin/${tool}" "native-tools/${tool}"
            file "native-tools/${tool}" | grep -Eiq 'x86-64|x86_64'
          done

          echo "Native host tools:"
          file native-tools/*

      - name: Configure LLVM cross-build
        run: |
          set -euxo pipefail

          LLVM_DIR="${GITHUB_WORKSPACE}/${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64"
          NDK_SYSROOT="${LLVM_DIR}/sysroot"
          NDK_CLANG="${LLVM_DIR}/bin/clang"
          NDK_CLANGXX="${LLVM_DIR}/bin/clang++"
          NDK_LLD="${LLVM_DIR}/bin/ld.lld"
          NATIVE_TOOLS="${GITHUB_WORKSPACE}/native-tools"

          test -x "${NDK_CLANG}"
          test -x "${NDK_CLANGXX}"
          test -x "${NDK_LLD}"
          test -d "${NDK_SYSROOT}"
          for tool in llvm-tblgen llvm-min-tblgen clang-tblgen llvm-config clang-ast-dump; do
            test -x "${NATIVE_TOOLS}/${tool}"
          done

          rm -rf build-llvm llvm-out
          mkdir build-llvm
          cd build-llvm

          cmake -G Ninja ../llvm-project/llvm \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/llvm-out" \
            -DCMAKE_C_COMPILER="${NDK_CLANG}" \
            -DCMAKE_CXX_COMPILER="${NDK_CLANGXX}" \
            -DCMAKE_ASM_COMPILER="${NDK_CLANG}" \
            -DCMAKE_C_FLAGS="--target=${HOST_TRIPLE}${ANDROID_API} --sysroot=${NDK_SYSROOT}" \
            -DCMAKE_CXX_FLAGS="--target=${HOST_TRIPLE}${ANDROID_API} --sysroot=${NDK_SYSROOT}" \
            -DCMAKE_ASM_FLAGS="--target=${HOST_TRIPLE}${ANDROID_API} --sysroot=${NDK_SYSROOT}" \
            -DCMAKE_EXE_LINKER_FLAGS="--target=${HOST_TRIPLE}${ANDROID_API} --sysroot=${NDK_SYSROOT} -fuse-ld=${NDK_LLD}" \
            -DCMAKE_SHARED_LINKER_FLAGS="--target=${HOST_TRIPLE}${ANDROID_API} --sysroot=${NDK_SYSROOT} -fuse-ld=${NDK_LLD}" \
            -DCMAKE_MODULE_LINKER_FLAGS="--target=${HOST_TRIPLE}${ANDROID_API} --sysroot=${NDK_SYSROOT} -fuse-ld=${NDK_LLD}" \
            -DLLVM_HOST_TRIPLE="${HOST_TRIPLE}" \
            -DLLVM_DEFAULT_TARGET_TRIPLE="${HOST_TRIPLE}" \
            -DLLVM_TARGETS_TO_BUILD="AArch64" \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_NATIVE_TOOL_DIR="${NATIVE_TOOLS}" \
            -DLLVM_TABLEGEN="${NATIVE_TOOLS}/llvm-tblgen" \
            -DCLANG_TABLEGEN="${NATIVE_TOOLS}/clang-tblgen" \
            -DCLANG_AST_DUMP="${NATIVE_TOOLS}/clang-ast-dump" \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBEDIT=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_CURL=OFF \
            -DLLVM_ENABLE_FFI=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_BUILD_TESTS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_BUILD_EXAMPLES=OFF \
            -DCLANG_INCLUDE_TESTS=OFF \
            -DCLANG_BUILD_TESTS=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

          grep -E '^(LLVM_TABLEGEN|CLANG_TABLEGEN|CLANG_AST_DUMP|LLVM_NATIVE_TOOL_DIR):' \
            CMakeCache.txt || true

      - name: Build LLVM
        run: |
          set -euxo pipefail
          cmake --build build-llvm --parallel "$(nproc)"

      - name: Install AArch64 LLVM
        run: |
          set -euxo pipefail
          rm -rf llvm-out
          cmake --install build-llvm
          test -x llvm-out/bin/clang
          test -x llvm-out/bin/clang++
          test -x llvm-out/bin/ld.lld

      - name: Verify generated AArch64 LLVM
        run: |
          set -euxo pipefail

          test -x llvm-out/bin/clang
          test -x llvm-out/bin/clang++
          test -x llvm-out/bin/ld.lld

          file llvm-out/bin/clang
          file llvm-out/bin/clang++
          file llvm-out/bin/ld.lld

          file llvm-out/bin/clang | grep -Eiq 'ARM aarch64|AArch64'
          file llvm-out/bin/clang++ | grep -Eiq 'ARM aarch64|AArch64'
          file llvm-out/bin/ld.lld | grep -Eiq 'ARM aarch64|AArch64'

      - name: Package Termux-native NDK r28c
        run: |
          set -euxo pipefail

          rm -rf termux-ndk-r28c
          cp -a "${NDK_DIR}" termux-ndk-r28c

          OFFICIAL_PREBUILT="${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64"
          TERMUX_PREBUILT="termux-ndk-r28c/toolchains/llvm/prebuilt/linux-aarch64"

          test -d "${OFFICIAL_PREBUILT}/sysroot"
          test -x llvm-out/bin/clang
          test -x llvm-out/bin/clang++
          test -x llvm-out/bin/ld.lld

          # Keep the official r28c NDK layout, headers, sysroot, wrappers,
          # libc++ and metadata. Replace only the host LLVM prebuilt with
          # the AArch64/Android build.
          rm -rf "termux-ndk-r28c/toolchains/llvm/prebuilt/linux-x86_64"
          mkdir -p "$(dirname "${TERMUX_PREBUILT}")"
          mkdir -p "${TERMUX_PREBUILT}"

          cp -a "${OFFICIAL_PREBUILT}/sysroot" "${TERMUX_PREBUILT}/"

          # Copy the newly built AArch64 host executables/libraries.
          cp -a llvm-out/. "${TERMUX_PREBUILT}/"

          # Restore NDK files that the LLVM install does not provide but
          # are part of the official r28c host toolchain layout.
          for item in lib64; do
            if [ -e "${OFFICIAL_PREBUILT}/${item}" ]; then
              cp -a "${OFFICIAL_PREBUILT}/${item}" "${TERMUX_PREBUILT}/"
            fi
          done

          # The package must expose a Linux-AArch64 host directory.
          test -x "${TERMUX_PREBUILT}/bin/clang"
          test -x "${TERMUX_PREBUILT}/bin/clang++"
          test -x "${TERMUX_PREBUILT}/bin/ld.lld"

          file "${TERMUX_PREBUILT}/bin/clang" | grep -Eiq 'ARM aarch64|AArch64'
          file "${TERMUX_PREBUILT}/bin/clang++" | grep -Eiq 'ARM aarch64|AArch64'
          file "${TERMUX_PREBUILT}/bin/ld.lld" | grep -Eiq 'ARM aarch64|AArch64'

          grep -q "Pkg.Revision = ${NDK_VERSION}" \
            termux-ndk-r28c/source.properties

          tar -cJf android-ndk-r28c-termux-aarch64.tar.xz termux-ndk-r28c
          test -s android-ndk-r28c-termux-aarch64.tar.xz
          ls -lh android-ndk-r28c-termux-aarch64.tar.xz

      - name: Upload Termux NDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-ndk-r28c-termux-aarch64
          path: android-ndk-r28c-termux-aarch64.tar.xz
          if-no-files-found: error
