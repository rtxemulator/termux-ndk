name: Build Termux-native NDK r28c (AArch64)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NDK_VERSION: "28.2.13676358"
  NDK_PACKAGE: "android-ndk-r28c-linux.zip"
  NDK_DIR: "android-ndk-r28c"
  LLVM_BRANCH: "llvm-r530567"
  LLVM_VERSION: "clang-r530567e"
  HOST_TRIPLE: "aarch64-linux-android"
  ANDROID_API: "28"
  LLVM_SOURCE_REVISION: "3b5e7c83a6e226d5bd7ed2e9b67449b64812074c"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Maximize build space
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build python3 git ccache wget unzip file
          cmake --version
          ninja --version
          git --version
          wget --version | head -n 1

      - name: Download official Android NDK r28c
        run: |
          set -euxo pipefail
          wget --show-progress \
            "https://dl.google.com/android/repository/${NDK_PACKAGE}"

          echo "a7b54a5de87fecd125a17d54f73c446199e72a64  ${NDK_PACKAGE}" | sha1sum -c -
          unzip -q "${NDK_PACKAGE}"
          test -d "${NDK_DIR}"
          test -f "${NDK_DIR}/source.properties"
          grep -q "Pkg.Revision = ${NDK_VERSION}" \
            "${NDK_DIR}/source.properties"

      - name: Verify official NDK r28c
        run: |
          set -euxo pipefail
          LLVM_DIR="${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64"

          test -f "${NDK_DIR}/source.properties"
          grep -q "Pkg.Revision = ${NDK_VERSION}" \
            "${NDK_DIR}/source.properties"

          test -x "${LLVM_DIR}/bin/clang"
          test -x "${LLVM_DIR}/bin/clang++"
          test -x "${LLVM_DIR}/bin/ld.lld"

          cat "${NDK_DIR}/source.properties"
          "${LLVM_DIR}/bin/clang" --version

      - name: Checkout exact r28c Android LLVM sources and patch set
        run: |
          set -euxo pipefail

          rm -rf llvm-project llvm_android toolchain-utils

          # r28c is clang-r530567e. Android's llvm-r530567 branch is the
          # Android toolchain branch for that compiler generation. The NDK's
          # clang_source_info identifies 3b5e7c83... as the upstream base;
          # llvm_android supplies the Android-specific downstream patches.
          git clone --filter=blob:none --no-checkout \
            https://android.googlesource.com/toolchain/llvm-project.git llvm-project
          cd llvm-project
          git fetch --depth=1 origin "${LLVM_SOURCE_REVISION}"
          git checkout --detach "${LLVM_SOURCE_REVISION}"
          cd ..

          git clone --depth=1 -b llvm-r530567 \
            https://android.googlesource.com/toolchain/llvm_android.git llvm_android

          git clone --depth=1 -b llvm-r530567 \
            https://android.googlesource.com/platform/external/toolchain-utils.git toolchain-utils

          test "$(git -C llvm-project rev-parse HEAD)" = "${LLVM_SOURCE_REVISION}"
          test -f llvm_android/patches/PATCHES.json
          test -x toolchain-utils/llvm_tools/patch_manager.py || test -f toolchain-utils/llvm_tools/patch_manager.py

          # 530567 is the Android LLVM revision used by r28c. Apply the exact
          # Android patch metadata from the llvm-r530567 toolchain branch.
          PYTHONPATH="${GITHUB_WORKSPACE}/toolchain-utils" \
            python3 toolchain-utils/llvm_tools/patch_manager.py \
              --svn_version 530567 \
              --patch_metadata_file "${GITHUB_WORKSPACE}/llvm_android/patches/PATCHES.json" \
              --filesdir_path "${GITHUB_WORKSPACE}/llvm_android/patches" \
              --src_path "${GITHUB_WORKSPACE}/llvm-project" \
              --failure_mode fail

          echo "LLVM base: $(git -C llvm-project rev-parse HEAD)"
          echo "Android LLVM branch: $(git -C llvm_android rev-parse HEAD)"

      - name: Patch LLVM build-time host tool wiring
        run: |
          set -euxo pipefail

          TOOLING_CMAKE="llvm-project/clang/lib/Tooling/CMakeLists.txt"

          test -f "${TOOLING_CMAKE}"

          # r28c's LLVM base revision predates the later CLANG_AST_DUMP host-tool
          # wiring. During a cross-build, clang-ast-dump is a build-time program
          # and must run on the x86_64 GitHub runner, not be executed as an
          # AArch64 Android binary.
          python3 - "${TOOLING_CMAKE}" <<'PY'
          import re
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          text = p.read_text()

          pattern = r"COMMAND\s+\$<TARGET_FILE:clang-ast-dump>"
          replacement = "COMMAND\n      ${LLVM_NATIVE_TOOL_DIR}/clang-ast-dump"

          patched, count = re.subn(pattern, replacement, text, count=1)
          if count == 0:
              if "${LLVM_NATIVE_TOOL_DIR}/clang-ast-dump" in text:
                  print("Host clang-ast-dump wiring already present.")
              else:
                  raise SystemExit(
                      "ERROR: expected clang-ast-dump command was not found; "
                      "refusing to guess."
                  )
          else:
              p.write_text(patched)
              print("Applied host clang-ast-dump wiring patch.")
          PY

          grep -n -A8 -B4 'LLVM_NATIVE_TOOL_DIR}/clang-ast-dump' \
            "${TOOLING_CMAKE}"

      - name: Build native LLVM host tools
        run: |
          set -euxo pipefail
          rm -rf native-tools native-build

          test "$(git -C llvm-project rev-parse HEAD)" = "${LLVM_SOURCE_REVISION}"

          cmake \
            -S llvm-project/llvm \
            -B native-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang" \
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64;ARM" \
            -DLLVM_BUILD_TESTS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBEDIT=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_CURL=OFF \
            -DLLVM_ENABLE_FFI=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF

          cmake --build native-build \
            --target clang clang++ clang-ast-dump llvm-tblgen clang-tblgen llvm-config \
            --parallel "$(nproc)"

          mkdir -p native-tools
          cp -a native-build/bin/llvm-tblgen native-tools/
          cp -a native-build/bin/clang-tblgen native-tools/
          cp -a native-build/bin/llvm-config native-tools/

          cp -a native-build/bin/clang native-tools/
          cp -a native-build/bin/clang++ native-tools/
          cp -a native-build/bin/clang-ast-dump native-tools/

          for tool in clang clang++ clang-ast-dump llvm-tblgen clang-tblgen llvm-config; do
            test -x "native-tools/${tool}"
          done

          file native-tools/clang | grep -Eiq 'x86-64|x86_64'
          file native-tools/clang-ast-dump | grep -Eiq 'x86-64|x86_64'
          file native-tools/llvm-tblgen | grep -Eiq 'x86-64|x86_64' 

          file native-tools/llvm-tblgen
          file native-tools/clang-tblgen
          native-tools/llvm-tblgen --version
          native-tools/clang-tblgen --version
          native-tools/llvm-config --version

      - name: Configure LLVM cross-build
        run: |
          set -euxo pipefail

          LLVM_DIR="${GITHUB_WORKSPACE}/${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64"
          NDK_SYSROOT="${LLVM_DIR}/sysroot"
          NDK_CLANG="${LLVM_DIR}/bin/clang"
          NDK_CLANGXX="${LLVM_DIR}/bin/clang++"
          NDK_LLD="${LLVM_DIR}/bin/ld.lld"
          NATIVE_TOOLS="${GITHUB_WORKSPACE}/native-tools"

          test -x "${NDK_CLANG}"
          test -x "${NDK_CLANGXX}"
          test -x "${NDK_LLD}"
          test -d "${NDK_SYSROOT}"
          for tool in clang clang++ clang-ast-dump llvm-tblgen clang-tblgen llvm-config; do
            test -x "${NATIVE_TOOLS}/${tool}"
          done

          rm -rf build-llvm llvm-out
          mkdir build-llvm
          cd build-llvm

          cmake -G Ninja ../llvm-project/llvm \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/llvm-out" \
            -DCMAKE_C_COMPILER="${NDK_CLANG}" \
            -DCMAKE_CXX_COMPILER="${NDK_CLANGXX}" \
            -DCMAKE_ASM_COMPILER="${NDK_CLANG}" \
            -DCMAKE_C_FLAGS="--target=${HOST_TRIPLE}${ANDROID_API} --sysroot=${NDK_SYSROOT}" \
            -DCMAKE_CXX_FLAGS="--target=${HOST_TRIPLE}${ANDROID_API} --sysroot=${NDK_SYSROOT}" \
            -DCMAKE_ASM_FLAGS="--target=${HOST_TRIPLE}${ANDROID_API} --sysroot=${NDK_SYSROOT}" \
            -DCMAKE_EXE_LINKER_FLAGS="--target=${HOST_TRIPLE}${ANDROID_API} --sysroot=${NDK_SYSROOT} -fuse-ld=${NDK_LLD}" \
            -DCMAKE_SHARED_LINKER_FLAGS="--target=${HOST_TRIPLE}${ANDROID_API} --sysroot=${NDK_SYSROOT} -fuse-ld=${NDK_LLD}" \
            -DCMAKE_MODULE_LINKER_FLAGS="--target=${HOST_TRIPLE}${ANDROID_API} --sysroot=${NDK_SYSROOT} -fuse-ld=${NDK_LLD}" \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_SYSTEM_VERSION="${ANDROID_API}" \
            -DCMAKE_ANDROID_NDK="${GITHUB_WORKSPACE}/${NDK_DIR}" \
            -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DLLVM_HOST_TRIPLE="${HOST_TRIPLE}" \
            -DLLVM_DEFAULT_TARGET_TRIPLE="${HOST_TRIPLE}" \
            -DLLVM_TARGETS_TO_BUILD="AArch64" \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_NATIVE_TOOL_DIR="${NATIVE_TOOLS}" \
            -DLLVM_TABLEGEN="${NATIVE_TOOLS}/llvm-tblgen" \
            -DCLANG_TABLEGEN="${NATIVE_TOOLS}/clang-tblgen" \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBEDIT=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_CURL=OFF \
            -DLLVM_ENABLE_FFI=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_BUILD_TESTS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_BUILD_EXAMPLES=OFF \
            -DCLANG_INCLUDE_TESTS=OFF \
            -DCLANG_BUILD_TESTS=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

          grep -E '^(LLVM_TABLEGEN|CLANG_TABLEGEN|LLVM_NATIVE_TOOL_DIR|LLVM_USE_HOST_TOOLS):' \
            CMakeCache.txt || true

      - name: Build and install LLVM
        run: |
          set -euxo pipefail
          cmake --build build-llvm --parallel "$(nproc)"
          cmake --build build-llvm --target install --parallel "$(nproc)"

      - name: Verify generated AArch64 LLVM
        run: |
          set -euxo pipefail

          test -x llvm-out/bin/clang
          test -x llvm-out/bin/clang++
          test -x llvm-out/bin/ld.lld
          test "$(git -C llvm-project rev-parse HEAD)" = "${LLVM_SOURCE_REVISION}"

          file llvm-out/bin/clang
          file llvm-out/bin/clang++
          file llvm-out/bin/ld.lld

          file llvm-out/bin/clang | grep -Eiq 'ARM aarch64|AArch64'
          file llvm-out/bin/clang++ | grep -Eiq 'ARM aarch64|AArch64'
          file llvm-out/bin/ld.lld | grep -Eiq 'ARM aarch64|AArch64'

      - name: Package Termux-native NDK r28c
        run: |
          set -euxo pipefail

          rm -rf termux-ndk-r28c

          # Start from the complete official r28c NDK so all non-LLVM files
          # remain available. Only the host LLVM prebuilt is replaced.
          cp -a "${NDK_DIR}" termux-ndk-r28c

          OFFICIAL_PREBUILT="termux-ndk-r28c/toolchains/llvm/prebuilt/linux-x86_64"
          TERMUX_PREBUILT="termux-ndk-r28c/toolchains/llvm/prebuilt/linux-aarch64"

          test -d "${OFFICIAL_PREBUILT}"
          rm -rf "${TERMUX_PREBUILT}"
          mkdir -p "${TERMUX_PREBUILT}"

          # Keep the official r28c sysroot and support data.
          cp -a "${OFFICIAL_PREBUILT}/sysroot" "${TERMUX_PREBUILT}/"

          # Preserve only symlinks from the official bin directory. The real
          # x86_64 ELF files must never enter the Termux package.
          mkdir -p "${TERMUX_PREBUILT}/bin"
          while IFS= read -r -d '' link; do
            cp -a "${link}" "${TERMUX_PREBUILT}/bin/"
          done < <(find "${OFFICIAL_PREBUILT}/bin" -maxdepth 1 -type l -print0)

          if [ -d "${OFFICIAL_PREBUILT}/lib64" ]; then
            cp -a "${OFFICIAL_PREBUILT}/lib64" "${TERMUX_PREBUILT}/"
          fi
          if [ -d "${OFFICIAL_PREBUILT}/include" ]; then
            cp -a "${OFFICIAL_PREBUILT}/include" "${TERMUX_PREBUILT}/"
          fi
          if [ -d "${OFFICIAL_PREBUILT}/share" ]; then
            cp -a "${OFFICIAL_PREBUILT}/share" "${TERMUX_PREBUILT}/"
          fi

          # Replace the LLVM implementation itself with the AArch64 Android
          # build. This also supplies llvm-ar/llvm-nm/etc. where LLVM installs
          # them.
          cp -a llvm-out/. "${TERMUX_PREBUILT}/"

          # The host directory name used by existing Termux NDK releases is
          # linux-aarch64: the binaries themselves are Android AArch64.
          # Do NOT call this aarch64-linux-android; that is the target triple,
          # not the NDK host-prebuilt directory convention.
          test -x "${TERMUX_PREBUILT}/bin/clang"
          test -x "${TERMUX_PREBUILT}/bin/clang++"
          test -x "${TERMUX_PREBUILT}/bin/ld.lld"

          file "${TERMUX_PREBUILT}/bin/clang"
          file "${TERMUX_PREBUILT}/bin/clang++"
          file "${TERMUX_PREBUILT}/bin/ld.lld"

          file "${TERMUX_PREBUILT}/bin/clang" | grep -Eiq 'ARM aarch64|AArch64'
          file "${TERMUX_PREBUILT}/bin/clang++" | grep -Eiq 'ARM aarch64|AArch64'
          file "${TERMUX_PREBUILT}/bin/ld.lld" | grep -Eiq 'ARM aarch64|AArch64'

          # Remove the original x86_64 host compiler directory.
          rm -rf "${OFFICIAL_PREBUILT}"

          # simpleperf is another NDK host executable. r28c ships an Android
          # arm64 simpleperf binary which can be used directly from Termux.
          if [ -f "termux-ndk-r28c/simpleperf/android/arm64/simpleperf" ]; then
            rm -rf termux-ndk-r28c/simpleperf/bin/linux-x86_64
            mkdir -p termux-ndk-r28c/simpleperf/bin/linux-aarch64
            ln -sf ../../android/arm64/simpleperf \
              termux-ndk-r28c/simpleperf/bin/linux-aarch64/simpleperf
          fi

          # There must be no x86_64 ELF left in the host-tool locations we
          # expect Termux to execute. Other official NDK files may remain
          # platform-specific data and are not treated as Termux host tools.
          if find "termux-ndk-r28c/toolchains/llvm/prebuilt/linux-aarch64/bin" \
              "termux-ndk-r28c/simpleperf/bin/linux-aarch64" \
              -type f -perm -u+x -print0 2>/dev/null |
              xargs -0 -r file | grep -Eiq 'x86-64|x86_64'; then
            echo "ERROR: x86_64 executable leaked into Termux host-tool directories."
            exit 1
          fi

          # Make the r28c identity explicit in the package.
          grep -q "Pkg.Revision = ${NDK_VERSION}" "termux-ndk-r28c/source.properties"
          printf '%s\n' \
            "NDK_VERSION=${NDK_VERSION}" \
            "CLANG_VERSION=${LLVM_VERSION}" \
            "LLVM_BASE_REVISION=${LLVM_SOURCE_REVISION}" \
            "LLVM_ANDROID_BRANCH=llvm-r530567" \
            "TERMUX_HOST_PREBUILT=linux-aarch64" \
            "TARGET_TRIPLE=${HOST_TRIPLE}" \
            "ANDROID_API=${ANDROID_API}" \
            > termux-ndk-r28c/TERMUX_NDK_BUILD_INFO

          tar -cJf android-ndk-r28c-termux-aarch64.tar.xz termux-ndk-r28c
          test -s android-ndk-r28c-termux-aarch64.tar.xz
          ls -lh android-ndk-r28c-termux-aarch64.tar.xz

      - name: Upload Termux NDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-ndk-r28c-termux-aarch64
          path: android-ndk-r28c-termux-aarch64.tar.xz
          if-no-files-found: error
