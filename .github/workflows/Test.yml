name: Cross-Compile and Test C++ for ARM64

on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Install ARM64 Cross-Compiler and Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y g++-aarch64-linux-gnu file

    - name: Create C++ Source File
      run: |
        cat << 'EOF' > main.cpp
        #include <iostream>

        int main() {
            std::cout << "Hi, mom!" << std::endl;
            std::cout << "2 + 2 = " << (2 + 2) << std::endl;
            return 0;
        }
        EOF

    - name: Cross-Compile for ARM64
      run: |
        aarch64-linux-gnu-g++ -static main.cpp -o main_arm64

    - name: Verify ELF Binary
      run: |
        echo "Checking binary architecture..."
        file main_arm64
        # Verify that 'aarch64' or 'ARM aarch64' is present in the file output
        file main_arm64 | grep -q "aarch64"

    - name: Set up QEMU for ARM64 Emulation
      uses: docker/setup-qemu-action@v3

    - name: Test ARM64 Binary inside Ubuntu ARM Container
      run: |
        docker run --rm -v ${{ github.workspace }}:/work -w /work arm64v8/ubuntu:latest ./main_arm64
